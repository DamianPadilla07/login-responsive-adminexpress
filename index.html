<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminExpress - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #f7f8fa;
        }

        /* ESTRUCTURA PRINCIPAL GRID 50% / 50% */
        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100vw;
            height: 100vh;
            min-height: 600px;
        }

        /* PANEL AZUL IZQUIERDO */
        .brand-panel {
            background-color: #0061f2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 40px;
        }

        .brand-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* PANEL BLANCO DERECHO (CENTRADO EN ESCRITORIO Y MÓVIL) */
        .form-panel {
            background-color: #f7f8fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-section {
            margin-bottom: 32px;
            text-align: left; /* Cambiar de center a left */
            width: 100%;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Cambiar de center a flex-start */
            gap: 6px;
            font-size: 1.6rem;
            color: #2b3674;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .form-subtitle {
            font-size: 0.78rem;
            color: #8f9bba;
            line-height: 1.5;
            font-weight: 500;
            text-align: left; /* Cambiar de center a left */
        }

        .title-light {
            font-weight: 400;
            color: #2b3674;
        }

        .title-bold {
            font-weight: 800;
            color: #1b2559;
        }

        .hand-emoji {
            font-size: 1.4rem;
        }

        /* FORMULARIO Y CAMPOS */
        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #2b3674;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #8f9bba;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-icon svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.2;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            font-size: 0.82rem;
            border: 1px solid transparent;
            border-radius: 12px;
            background-color: #ffffff;
            color: #1b2559;
            outline: none;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #b0bbd5;
        }

        .form-input:focus {
            border-color: #0061f2;
            background-color: #ffffff;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            cursor: pointer;
            color: #8f9bba;
            display: flex;
            align-items: center;
        }

        .forgot-password-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            margin-bottom: 28px;
        }

        .forgot-password-link {
            font-size: 0.72rem;
            color: #0061f2;
            text-decoration: none;
            font-weight: 700;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background-color: #0061f2;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0px 6px 16px rgba(0, 97, 242, 0.25);
            transition: background-color 0.2s ease;
            margin-bottom: 28px;
        }

        .submit-btn:hover {
            background-color: #0052cc;
        }

        .signup-prompt {
            text-align: center;
            font-size: 0.75rem;
            color: #8f9bba;
            font-weight: 500;
        }

        .signup-link {
            color: #0061f2;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* --- MEDIA QUERIES (VERSIÓN MÓVIL) --- */
        @media (max-width: 767px) {
            .login-container {
                grid-template-columns: 1fr;
                height: 100vh;
                background-color: #f7f8fa;
            }

            .brand-panel {
                display: none;
            }

            .form-panel {
                padding: 32px 20px;
                justify-content: center;
                align-items: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="login-container">
        <!-- Panel Izquierdo Azul (Escritorio 50%) -->
        <section class="brand-panel">
            <h1 class="brand-title">AdminExpress</h1>
        </section>

        <!-- Panel Blanco Formulario (Escritorio 50% / Móvil 100%) -->
        <section class="form-panel">
            <div class="form-wrapper">
                <div class="header-section">
                    <div class="title-row">
                        <span class="title-light">Vamos a</span>
                        <span class="title-bold">Iniciar Sesión</span>
                        <span class="hand-emoji">👇</span>
                    </div>
                    <p class="form-subtitle">Hola, ingresa tus datos para acceder a tu cuenta.</p>
                </div>

                <form id="loginForm" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label class="form-label" for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            </span>
                            <input type="email" id="email" class="form-input" placeholder="Ingresa tu correo" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </span>
                            <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Mostrar u ocultar contraseña">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </button>
                        </div>
                    </div>

                    <div class="forgot-password-container">
                        <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="submit-btn">Iniciar Sesión</button>

                    <p class="signup-prompt">
                        ¿No tienes una cuenta? <a href="#" class="signup-link">Regístrate</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }
    </script>
</body>
</html>
